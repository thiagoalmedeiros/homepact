version: '3'

dotenv: ['.env']

vars:
  COMPOSE: docker compose --env-file .env -f infra/docker-compose.yml

tasks:
  default:
    cmds:
      - task --list
    silent: true

  up:
    desc: Run the whole app with no Docker (own MongoDB with demo data, API, web build); Ctrl+C stops it
    deps: [install]
    cmds:
      - npm start -- {{.CLI_ARGS}}

  dev:
    desc: Run the whole app with no Docker, with live reload (API restarts, web reloads on change)
    deps: [install]
    cmds:
      - npm run dev

  e2e:
    desc: Run the browser tests (starts the app with no Docker unless it is already up)
    deps: [install]
    cmds:
      - npm run e2e -- {{.CLI_ARGS}}

  check:
    desc: Lint, format check, typecheck and every unit test
    deps: [install]
    cmds:
      - npm run check

  test:
    desc: Run all unit tests (shared, web, API)
    deps: [install]
    cmds:
      - npm test

  test:shared:
    desc: Run only the shared package unit tests
    deps: [build:shared]
    cmds:
      - npm test -w packages/shared -- {{.CLI_ARGS}}

  test:web:
    desc: Run only the web (Angular) unit tests
    deps: [build:shared]
    cmds:
      - npm test -w apps/web -- {{.CLI_ARGS}}

  test:api:
    desc: Run only the API unit tests (each layer with the layer below mocked; no database)
    deps: [build:shared]
    cmds:
      - npm test -w apps/api -- {{.CLI_ARGS}}

  docker:up:
    desc: Optional. Build and start the containers (MongoDB, API, web) with demo data, then print the logins
    deps: [env, install]
    cmds:
      - '{{.COMPOSE}} up --build -d {{.CLI_ARGS}}'
      - '{{.COMPOSE}} logs --no-log-prefix seed'

  docker:down:
    desc: Optional. Stop the containers and keep their data (task docker:down -- -v also deletes it)
    cmds:
      - '{{.COMPOSE}} down {{.CLI_ARGS}}'

  clean:
    desc: Delete all node_modules, build output and caches (keeps .env and package-lock.json, which pins the versions)
    cmds:
      - |
        find . -name .git -prune -o -type d \( -name node_modules -o -name dist -o -name .angular -o -name .vite -o -name .cache -o -name coverage -o -name .nyc_output -o -name out-tsc -o -name .turbo -o -name .nx -o -name .parcel-cache -o -name .sass-cache \) -prune -exec rm -rf {} +
      - |
        find . -name .git -prune -o -type f \( -name '*.tsbuildinfo' -o -name .eslintcache -o -name .stylelintcache -o -name .prettiercache -o -name '*.log' \) -exec rm -f {} +
      - rm -rf .task
      - echo "Removed node_modules, build output and caches"

  env:
    internal: true
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      - echo "Created .env from .env.example"

  install:
    internal: true
    sources: [package.json, package-lock.json, apps/*/package.json, packages/*/package.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm install

  build:shared:
    internal: true
    deps: [install]
    sources: [packages/shared/src/**/*.ts, packages/shared/tsconfig.json]
    generates: [packages/shared/dist/index.js]
    cmds:
      - npm run build -w packages/shared

<hc-sheet [title]="title()" (closed)="closed.emit()">
  <form class="stack" (ngSubmit)="submit()">
    <p class="small muted">{{ message() }}</p>
    <div class="field">
      <label for="reason" i18n="@@reasonSheet.label">Reason</label>
      <input
        id="reason"
        class="input"
        name="reason"
        maxlength="500"
        required
        [(ngModel)]="reason"
        data-testid="reason"
      />
    </div>
    <button
      class="btn btn-danger btn-block"
      type="submit"
      [disabled]="busy() || reason.trim().length < 3"
      data-testid="reason-submit"
    >
      {{ confirmLabel() }}
    </button>
  </form>
</hc-sheet>
